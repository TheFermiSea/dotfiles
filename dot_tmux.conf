# tmux configuration — distributed by chezmoi from TheFermiSea/dotfiles.
#
# Written 2026-09-11. Before this there was NO tmux config on any machine, which
# is why tmux felt worse than it is. The design targets how it is actually used
# here: long-lived agent sessions (Claude, Codex) running for hours on five
# different machines, where the expensive mistakes are
#   (a) not knowing which machine a pane is on, and
#   (b) losing a session you did not mean to touch.
#
# Prefix is left as the default C-b deliberately. Remapping it is the most
# common tmux advice and the worst thing to do to muscle memory that already
# exists across five boxes and several SSH hops.

# --- reload ----------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# --- basics ----------------------------------------------------------------
set -g mouse on
set -g base-index 1                 # windows start at 1; 0 is a reach
setw -g pane-base-index 1
set -g renumber-windows on          # no gaps after closing a window
set -g escape-time 10               # default 500ms makes vim/nvim feel broken
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,alacritty:Tc,xterm-ghostty:Tc"

# Agent output is long. The default 2000 lines loses a build log in seconds.
set -g history-limit 200000

# --- names stay put --------------------------------------------------------
# Agent sessions are identified by name (rdcodex, lens-re, rdcleanup-3...).
# tmux renaming a window to the running command destroys that.
set -g allow-rename off
setw -g automatic-rename off

# Agents produce constant output; bells and activity flags become noise.
set -g monitor-activity off
set -g visual-activity off
set -g bell-action none

# --- copy mode -------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind Enter copy-mode

# --- splits keep the current directory --------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# --- pane navigation --------------------------------------------------------
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Show pane numbers long enough to actually read them.
set -g display-panes-time 2000
set -g display-time 2000

# --- MACHINE IDENTITY -------------------------------------------------------
# The same problem the Claude status line solves: five machines, very different
# blast radii — one drives a Class-IV laser, one serves the shared beads
# database. Colours match the status-line chips so the two reinforce each other.
#
#   mac        blue     ai-proxy   green    leabs-dev  purple
#   maitai     orange   windows    cyan     unknown    grey
#
# The hazard suffix is deliberate: if a pane says maitai or windows, a careless
# command reaches real hardware.
#
# The generic default is set FIRST and the host-specific rules override it. An
# earlier revision put the fallback last, guarded by `if-shell 'true'`, which
# ran unconditionally and clobbered every chip that had just been set — ai-proxy
# rendered blank and leabs-dev rendered "<'hostname -s' not ready>", because a
# #() shell substitution is not resolved at the time `set -gF` evaluates it.
set -g @host_style "#[fg=colour15,bg=colour240,bold] #h "

if-shell '[ "$(hostname -s)" = "brians-macbook-pro-2310" ]' \
  'set -g @host_style "#[fg=colour15,bg=colour33,bold] 💻 mac "'
if-shell '[ "$(hostname -s)" = "ai-proxy" ]' \
  'set -g @host_style "#[fg=colour16,bg=colour42,bold] 🖥 ai-proxy · SHARED-DB "'
if-shell '[ "$(hostname -s)" = "leabs-dev" ]' \
  'set -g @host_style "#[fg=colour15,bg=colour141,bold] 🔬 leabs-dev "'
if-shell '[ "$(hostname -s)" = "maitai-optiplex7040" ]' \
  'set -g @host_style "#[fg=colour16,bg=colour208,bold] ⚗ maitai · HW "'
if-shell '[ "$(hostname -s)" = "ceng-gh62pk3" ]' \
  'set -g @host_style "#[fg=colour16,bg=colour81,bold] 🪟 windows · CLASS-IV "'

# --- status bar -------------------------------------------------------------
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=colour250,bg=colour235"

# Left: machine chip, then session name.
set -g status-left-length 60
set -g status-left "#{@host_style}#[fg=colour235,bg=colour238]#[fg=colour223,bg=colour238,bold] #S #[fg=colour238,bg=colour235]"

# Right: pane path, then time. Path matters when several panes sit in different
# worktrees of the same repo.
set -g status-right-length 90
set -g status-right "#[fg=colour238,bg=colour235]#[fg=colour223,bg=colour238] #{b:pane_current_path} #[fg=colour245,bg=colour238]#[fg=colour250,bg=colour238] %H:%M "

setw -g window-status-format "#[fg=colour245,bg=colour235] #I #W "
setw -g window-status-current-format "#[fg=colour235,bg=colour109]#[fg=colour235,bg=colour109,bold] #I #W #[fg=colour109,bg=colour235]"

# --- pane borders: which pane is live must be obvious ------------------------
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour109,bold"
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_current_command} "

# --- safety -----------------------------------------------------------------
# Confirm before killing. Agent sessions have been lost to a stray keypress.
bind x confirm-before -p "kill pane #P? (y/n)" kill-pane
bind & confirm-before -p "kill window #W? (y/n)" kill-window
bind X confirm-before -p "KILL SESSION #S? (y/n)" kill-session

# Detach, never exit, is the right default for an agent session.
bind d detach-client

# Quick session switcher — useful with many named agent sessions.
bind s choose-tree -Zs
